[project]
name = "triagem"
version = "1.0.0"
description = "Triagem automatica de laudos medicos por urgencia clinica"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "pydantic==2.13.5",
    "prometheus-client==0.26.0",
    "onnxruntime==1.30.0",
    "numpy>=2.0",
]

[project.optional-dependencies]
training = [
    "scikit-learn==1.9.1",
    "skl2onnx==1.20.0",
    "onnx==1.22.0",
    "pandas==3.0.5",
    "joblib==1.6.0",
]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
    "ruff==0.16.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "airflow/logs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"
