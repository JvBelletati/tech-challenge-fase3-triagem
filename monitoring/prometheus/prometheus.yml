global:
  # 5s instead of the usual 15s: during a 5-minute video demo, a 15s interval
  # produces too few points for the rate() windows to look like anything.
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: triagem-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          servico: triagem

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
